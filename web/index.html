<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ziroze PC Bridge</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><p class="eyebrow">DEVICE GATEWAY · MVP</p><h1>Ziroze PC Bridge</h1><p>Read-only diagnostics for enrolled Linux devices.</p></div><span id="state">Not connected</span></header><section><h2>Gateway connection</h2><label>Gateway URL<input id="base" placeholder="https://bridge.example.com"></label><label>Admin token<input id="token" type="password" placeholder="Token held in this tab only"></label><button id="connect">Load devices</button><p id="message"></p></section><section><h2>Devices</h2><button id="refresh" class="secondary">Refresh</button><div id="devices">Connect to load devices.</div></section><section><h2>Run diagnostic</h2><label>Device<select id="device"><option value="">Select device</option></select></label><label>Operation<select id="operation"><option value="system_info">System information</option><option value="resource_usage">CPU and memory</option><option value="disk_usage">Disk usage</option><option value="network_summary">Network counters</option></select></label><button id="run">Queue diagnostic</button><pre id="result">No diagnostic requested.</pre></section><footer>Use HTTPS remotely. Never share your admin token.</footer></main><script src="app.js"></script></body></html>
